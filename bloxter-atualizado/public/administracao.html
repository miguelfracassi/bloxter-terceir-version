<!doctype html><html lang="pt-BR" data-theme="dark"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração · Bloxter</title><link rel="icon" href="/icon.png"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><script>(function(){try{var th=localStorage.getItem("bx_theme");if(th==="light"||th==="dark")document.documentElement.setAttribute("data-theme",th)}catch(e){}})();</script><style>
.admin{max-width:1040px;margin:0 auto;padding:28px 18px 70px;color:var(--fg)}.admin h1{font-size:26px;margin:0}.admin .muted{color:var(--fg2);font-size:14px}.admin .panel{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:20px}.admin .login{max-width:390px;margin:12vh auto}.admin input,.admin textarea{box-sizing:border-box;width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:transparent;color:var(--fg);font:inherit}.admin textarea{min-height:100px;resize:vertical}.admin .stack{display:grid;gap:12px}.admin .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.admin nav{display:flex;gap:8px;margin:0 0 18px}.admin nav a{padding:9px 13px;border:1px solid var(--line);border-radius:10px;color:var(--fg);text-decoration:none}.admin nav a.active{background:var(--fg);color:var(--bg)}.admin .account,.admin .appeal{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}.admin .account:last-child,.admin .appeal:last-child{border:0}.admin .avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--line);display:grid;place-items:center;flex:none}.admin .info{min-width:0;flex:1}.admin .info b,.admin .info span{display:block;overflow-wrap:anywhere}.admin .actions{display:flex;gap:7px;flex-wrap:wrap}.admin .danger{border-color:#d93645;color:#d93645}.admin .status{font-size:12px;color:var(--fg2)}.admin .error{color:#e5484d;min-height:20px}.admin .confirm-back{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:20px;z-index:99}.admin .confirm{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 20px 60px #0008}.admin .confirm h2{margin:0 0 8px;font-size:20px}.admin .confirm p{color:var(--fg2)}.admin .appeal{display:block}.admin .appeal p{white-space:pre-wrap;overflow-wrap:anywhere}.admin .empty{padding:24px;text-align:center;color:var(--fg2)}.admin .success{color:#248f52}.admin .form-title{margin:2px 0 0}
</style></head><body><main class="admin" id="app"></main><script src="/js/administracao.js"></script></body></html>
