<!doctype html><html lang="pt-BR" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Acessibilidade · Bloxter</title><link rel="icon" href="/icon.png"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><script>(function(){try{var th=localStorage.getItem('bx_theme');if(th!=='light'&&th!=='dark')th='dark';document.documentElement.setAttribute('data-theme',th);var lg=localStorage.getItem('bx_lang');if(lg!=='pt'&&lg!=='en')lg='pt';document.documentElement.lang=lg==='pt'?'pt-BR':'en'}catch(e){}})();</script><style>.access-page{max-width:720px;margin:6vh auto;padding:24px 18px;color:var(--fg)}.access-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:24px}.access-head img{height:30px;filter:var(--logo-filter)}.access-card{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:24px;margin:16px 0}.access-card h2{font-size:18px;margin-bottom:4px}.access-card p{color:var(--fg2);font-size:14px;margin-bottom:16px}.access-options{display:flex;gap:10px;flex-wrap:wrap}.access-options button{border:1px solid var(--line);background:transparent;border-radius:12px;padding:11px 16px;color:var(--fg)}.access-options button.selected{background:var(--fg);color:var(--bg);border-color:var(--fg)}.access-back{color:var(--fg2)}@media(max-width:600px){.access-page{margin:2vh auto}.access-card{padding:18px}}</style></head><body><main class="access-page"><header class="access-head"><a href="/" aria-label="Bloxter"><img src="/logo.png" alt="Bloxter"></a><a class="access-back" id="back" href="/">Voltar</a></header><h1 id="title">Acessibilidade</h1><p id="subtitle">Personalize o idioma e a aparência do site.</p><section class="access-card"><h2 id="lang-title">Idioma</h2><p id="lang-help">Escolha o idioma da interface.</p><div class="access-options"><button type="button" data-lang="pt">Português</button><button type="button" data-lang="en">English</button></div></section><section class="access-card"><h2 id="theme-title">Aparência</h2><p id="theme-help">Escolha um tema confortável para você.</p><div class="access-options"><button type="button" data-theme-choice="light">Claro</button><button type="button" data-theme-choice="dark">Escuro</button></div></section></main><script src="/js/accessibility.js"></script></body></html>
