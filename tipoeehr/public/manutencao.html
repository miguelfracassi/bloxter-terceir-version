<!doctype html><html lang="pt-BR" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Em manutenção · Bloxter</title><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/style.css"><style>.maint{max-width:680px;margin:12vh auto;padding:24px}.maint section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px}.maint h1{font-size:34px}.maint p{white-space:pre-wrap;color:var(--fg2)}.maint .detail{padding:12px 0;border-top:1px solid var(--line)}</style></head><body><main class="maint"><section><a href="/" aria-label="Bloxter">Bloxter</a><h1>Estamos em manutenção</h1><p>Estamos fazendo melhorias no Bloxter. Volte em breve.</p><div class="detail"><b>Programador responsável</b><p id="programmer">Equipe Bloxter</p></div><div class="detail"><b>Motivo</b><p id="reason">Atualizações</p></div><div class="detail"><b>Atualizações</b><p id="updates">Estamos trabalhando para melhorar o site.</p></div><a href="/support">Suporte</a></section></main><script>fetch('/api/site-status').then(r=>r.json()).then(d=>{const m=d.maintenance||{};if(!m.enabled){location.replace('/');return;}for(const k of ['programmer','reason','updates'])document.getElementById(k).textContent=m[k]||({programmer:'Equipe Bloxter',reason:'Atualizações',updates:'Estamos trabalhando para melhorar o site.'}[k]);}).catch(()=>{});</script></body></html>
